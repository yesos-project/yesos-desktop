[package]
name = "yesos"
version = "0.1.0"
edition = "2021"
description = "YesOS Desktop - Rust part (for now only the core)"

[lib]
name = "yesos"
crate-type = ["staticlib"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[dependencies]
yesos_core = { path = "../core/rust" }
